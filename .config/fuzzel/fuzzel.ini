font=Roboto Mono:size=11
use-bold=yes
prompt="> "
placeholder="Type someting..."
match-mode=fzf
show-actions=yes
terminal=foot -e

lines=15
width=60
tabs=4
horizontal-pad=8
vertical-pad=4
inner-pad=4

line-height=21

[colors]
background=111111bb
text=eeeeeeff
prompt=b199c5ff
placeholder=aaaaaaff
input=ffffffff
match=bb9090ff
selection=99999944
selection-text=ffffffff
selection-match=cc5050ff
counter=555555ff

[border]
width=0
radius=14
selection-radius=8
