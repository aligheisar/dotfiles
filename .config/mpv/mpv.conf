osc=no

[Idle]
profile-cond=p["idle-active"]
profile-restore=copy-equal
title=' '
keepaspect=no
background=1

# Font
sub-font="Vazirmatn"

# Font size
sub-font-size=56

# Scale (multiplier)
sub-scale=1.0

# Text color (white)
sub-color="#BBFFFF"

# Border color
sub-border-color="#000000"

# Border size
sub-border-size=2

# Shadow
sub-shadow-offset=1

# Shadow color
sub-shadow-color="#000000"

# Background box
sub-back-color="#000000"
sub-back-alpha=0.3

# Position (100 = bottom, 0 = top)
sub-pos=95

# Bottom margin
sub-margin-y=20

