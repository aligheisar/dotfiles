[config]

[templates.quickshell]
input_path = "./templates/quickshell.json"
output_path = "~/.local/state/quickshell/generated/colors.json"

[templates.mako]
input_path = './templates/mako'
output_path = '~/.config/mako/colors'
post_hook = 'makoctl reload'

[templates.qt5ct]
input_path = './templates/qtct.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = './templates/qtct.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.rmpc]
input_path = './templates/rmpc.ron'
output_path = '~/.config/rmpc/themes/matugen.ron'

[templates.rofi]
input_path = './templates/rofi.rasi'
output_path = '~/.config/rofi/colors.rasi'

[templates.zen-userchrome]
input_path = './templates/zen-userchrome.css'
output_path = '/home/ali/.zen/0nwjxuan.Default (release)/chrome/zen-userChrome.css'

[templates.zen-usercontent]
input_path = './templates/zen-usercontent.css'
output_path = '/home/ali/.zen/0nwjxuan.Default (release)/chrome/zen-userContent.css'

[templates.gtk3]
input_path = './templates/gtk.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-{{mode}}'

[templates.gtk4]
input_path = './templates/gtk.css'
output_path = '~/.config/gtk-4.0/colors.css'
post_hook = '~/.config/matugen/post-hook-scripts/gtk-themes-reload.sh'

[templates.hyprland]
input_path = './templates/hyprland.lua'
output_path = '~/.config/hypr/colors.lua'

[templates.btop]
input_path = './templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'pkill -USR2 btop || true'